<style>
:root{
  --burgundy:#6E2230;--burgundy-deep:#5A1A26;--cabernet:#8B2638;
  --paper:#F3E8CF;--paper-2:#ECDEBE;--cream:#F6EEDA;
  --oak:#3A2A1C;--ink:#2B2117;--ink-soft:#5A4A38;
  --gold:#B8902F;--gold-deep:#977322;--gold-soft:#D8BC73;--green:#3f6b3f;--red:#9c2b32;
  --rule:rgba(58,42,28,0.28);--rule-soft:rgba(58,42,28,0.14);
  --font-display:'Oswald','Arial Narrow',sans-serif;--font-body:'Spectral',Georgia,serif;--font-mono:'Space Mono','Courier New',monospace;
}
*{box-sizing:border-box;}html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--font-body);color:var(--ink);background:radial-gradient(120% 90% at 50% -10%,#4a2a26,#3a201d 40%,#23120f 100%);-webkit-font-smoothing:antialiased;overflow:hidden;}
.frame-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;}
.phone{position:relative;width:min(440px,96vw);height:min(940px,94vh);overflow:hidden;border-radius:34px;
  background:linear-gradient(180deg,#2a1614,#1f1010);box-shadow:0 50px 110px -34px rgba(15,7,5,.85),0 0 0 9px #221513,0 0 0 11px rgba(216,188,115,.22);}
.statusbar{position:absolute;top:0;left:0;right:0;height:30px;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--gold-soft);}
.statusbar .batt{width:18px;height:9px;border:1px solid var(--gold-soft);border-radius:2px;opacity:.7;position:relative;}
.statusbar .batt::after{content:"";position:absolute;left:1px;top:1px;bottom:1px;width:11px;background:var(--gold-soft);border-radius:1px;}
.screen{position:absolute;inset:30px 0 0;overflow-y:auto;scrollbar-width:none;z-index:5;}
.screen::-webkit-scrollbar{display:none;}

/* ===== Agent crest header ===== */
.hq-head{position:relative;padding:20px 22px 22px;background:linear-gradient(165deg,#6E2230,#4a1620 70%,#3a121a);color:var(--cream);overflow:hidden;}
.hq-head::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,rgba(216,188,115,.06) 0 18px,transparent 18px 36px);}
.hq-top{display:flex;align-items:center;gap:7px;position:relative;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-soft);}
.hq-top .seal{width:16px;height:16px;border:1.5px solid var(--gold-soft);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;}
.agent-row{display:flex;align-items:center;gap:15px;margin-top:16px;position:relative;}
.crest{width:64px;height:64px;flex:0 0 auto;border-radius:50%;border:2.5px solid var(--gold-soft);display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 35%,rgba(216,188,115,.25),rgba(0,0,0,.2));box-shadow:0 6px 16px -8px rgba(0,0,0,.6);position:relative;}
.crest .badge-no{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);background:var(--gold-deep);color:#241803;font-family:var(--font-mono);font-size:7px;letter-spacing:.1em;padding:2px 7px;border-radius:999px;white-space:nowrap;}
.crest svg{width:34px;height:34px;}
.agent-meta{flex:1;min-width:0;}
.agent-meta .greet{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:rgba(246,238,218,.6);}
.agent-meta .rank{font-family:var(--font-display);font-weight:600;text-transform:uppercase;font-size:25px;line-height:.95;color:var(--cream);}
.xp-wrap{margin-top:14px;position:relative;}
.xp-bar{height:9px;border-radius:6px;background:rgba(0,0,0,.3);overflow:hidden;border:1px solid rgba(216,188,115,.3);}
.xp-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));transition:width .5s;}
.xp-label{display:flex;justify-content:space-between;margin-top:5px;font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(246,238,218,.65);}

/* stats strip */
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border-bottom:1.5px solid var(--rule);}
.stat-cell{background:var(--paper);padding:13px 6px;text-align:center;}
.stat-cell .num{font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--burgundy);line-height:1;}
.stat-cell .lab{font-family:var(--font-mono);font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px;}

.body{background:linear-gradient(180deg,var(--cream),var(--paper) 12%);padding:18px 18px 30px;}
.sec-h{font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.16em;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:10px;margin:6px 2px 13px;}
.sec-h::after{content:"";flex:1;height:1px;background:var(--rule-soft);}

/* featured assignment */
.assignment{position:relative;display:block;text-decoration:none;color:inherit;border-radius:14px;overflow:hidden;margin-bottom:22px;
  background:linear-gradient(150deg,#3a121a,#5a1a26);box-shadow:0 14px 30px -16px rgba(0,0,0,.7);border:1px solid rgba(216,188,115,.25);}
.assignment::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,rgba(216,188,115,.05) 0 16px,transparent 16px 32px);}
.assignment .a-pad{position:relative;padding:18px;}
.assignment .a-k{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-soft);display:flex;align-items:center;gap:8px;}
.assignment .a-k .live{width:7px;height:7px;border-radius:50%;background:#e7a3a7;animation:pulse 1.6s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(231,163,167,.6);}70%{box-shadow:0 0 0 7px transparent;}100%{box-shadow:0 0 0 0 transparent;}}
.assignment .a-title{font-family:var(--font-display);font-weight:600;text-transform:uppercase;font-size:26px;color:var(--cream);line-height:.95;margin:8px 0 6px;}
.assignment .a-desc{font-size:13px;color:rgba(246,238,218,.8);line-height:1.45;max-width:32ch;}
.assignment .a-go{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:13px;
  color:#241803;background:linear-gradient(180deg,var(--gold),var(--gold-deep));padding:9px 16px;border-radius:9px;}

.pp-sum-card{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit;margin-bottom:22px;
  background:rgba(255,255,255,.45);border:1px solid var(--rule);border-left:4px solid var(--gold-deep);border-radius:12px;padding:13px 15px;transition:.15s;}
.pp-sum-card:hover{background:rgba(255,255,255,.74);transform:translateY(-2px);}
.pp-sum-card .pps-ic{width:38px;height:38px;flex:0 0 auto;border-radius:9px;background:var(--gold-deep);color:var(--cream);display:flex;align-items:center;justify-content:center;}
.pp-sum-card .pps-ic svg{width:20px;height:20px;}
.pp-sum-card .pps-meta{flex:1;min-width:0;}
.pp-sum-card .pps-k{font-family:var(--font-mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep);}
.pp-sum-card .pps-v{font-size:13.5px;color:var(--ink);line-height:1.3;margin-top:2px;}
.pp-sum-card .pps-next{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px;}
.pp-sum-card .pps-go{font-size:22px;color:var(--ink-soft);}

/* module grid */
.modules{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.module{position:relative;display:flex;flex-direction:column;gap:9px;text-decoration:none;color:inherit;cursor:pointer;text-align:left;
  background:rgba(255,255,255,.45);border:1px solid var(--rule);border-radius:13px;padding:15px 14px;min-height:118px;transition:.15s;width:100%;font:inherit;}
.module:hover{background:rgba(255,255,255,.78);transform:translateY(-3px);box-shadow:0 12px 24px -16px rgba(0,0,0,.5);}
.module .m-ic{width:38px;height:38px;border-radius:10px;background:var(--burgundy);color:var(--cream);display:flex;align-items:center;justify-content:center;}
.module .m-ic svg{width:20px;height:20px;}
.module .m-name{font-family:var(--font-display);font-weight:600;text-transform:uppercase;font-size:15px;color:var(--ink);line-height:1;}
.module .m-sub{font-family:var(--font-mono);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);line-height:1.4;}
.module .m-status{position:absolute;top:11px;right:11px;font-family:var(--font-mono);font-size:7px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:999px;}
.module.live .m-status{background:rgba(63,107,63,.16);color:var(--green);}
.module.dev{opacity:.92;}
.module.dev .m-ic{background:var(--ink-soft);}
.module.dev .m-status{background:rgba(58,42,28,.1);color:var(--ink-soft);}
.module.dev .m-name{color:var(--ink-soft);}

/* achievements */
.ach-row{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;}
.ach-row::-webkit-scrollbar{display:none;}
.ach{flex:0 0 auto;width:76px;text-align:center;}
.ach .a-medal{width:54px;height:54px;margin:0 auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;
  background:rgba(184,144,47,.16);border:1.5px solid var(--gold-deep);}
.ach.locked .a-medal{background:rgba(58,42,28,.07);border:1.5px dashed var(--rule);filter:grayscale(1);opacity:.55;}
.ach .a-n{font-family:var(--font-mono);font-size:7.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);line-height:1.25;}

.hq-footer{text-align:center;font-family:var(--font-body);font-style:italic;color:var(--ink-soft);font-size:13px;margin-top:24px;padding-top:16px;border-top:1px solid var(--rule-soft);}
.reset-link{display:block;text-align:center;margin-top:12px;font-family:var(--font-mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);opacity:.5;cursor:pointer;background:none;border:none;width:100%;}

/* dev modal */
.devwrap{position:absolute;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(20,10,8,.55);backdrop-filter:blur(2px);}
.devwrap.show{display:flex;}
.devcard{width:100%;background:linear-gradient(180deg,var(--cream),var(--paper));border-radius:20px 20px 0 0;border-top:3px solid var(--gold);padding:24px 22px 28px;box-shadow:0 -20px 50px -20px rgba(0,0,0,.6);animation:up .28s cubic-bezier(.2,.9,.3,1);}
@keyframes up{from{transform:translateY(100%);}to{transform:none;}}
.devcard .d-ic{width:46px;height:46px;border-radius:12px;background:var(--gold);color:#241803;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.devcard .d-ic svg{width:24px;height:24px;}
.devcard .d-tag{font-family:var(--font-mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);}
.devcard .d-name{font-family:var(--font-display);font-weight:600;text-transform:uppercase;font-size:24px;color:var(--burgundy);margin:3px 0 10px;line-height:1;}
.devcard .d-desc{font-size:15.5px;line-height:1.55;color:var(--ink);}
.devcard .d-close{margin-top:18px;width:100%;font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:14px;border:none;border-radius:11px;padding:14px;background:linear-gradient(180deg,var(--burgundy),var(--burgundy-deep));color:var(--cream);cursor:pointer;}
.cf-list{margin:8px 0 4px;display:flex;flex-direction:column;gap:10px;max-height:48vh;overflow:auto;}
.cf-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--rule);background:rgba(255,255,255,.42);}
.cf-row.solved{border-color:rgba(120,150,95,.55);background:rgba(120,150,95,.13);}
.cf-row.locked{opacity:.6;border-style:dashed;}
.cf-meta{flex:1;min-width:0;}
.cf-code{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep);}
.cf-stat{color:var(--ink-soft);}
.cf-title{font-family:var(--font-display);font-weight:600;text-transform:uppercase;font-size:17px;color:var(--burgundy);line-height:1.05;margin:2px 0;}
.cf-reward{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);}
.cf-go{display:inline-block;font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:12px;text-decoration:none;background:linear-gradient(180deg,var(--burgundy),var(--burgundy-deep));color:var(--cream);padding:9px 13px;border-radius:9px;white-space:nowrap;}
.cf-lock{display:inline-block;font-size:10px;color:var(--ink-soft);font-style:italic;max-width:120px;text-align:right;line-height:1.3;}
</style>
</head>
<body>
  <div class="frame-wrap">
    <div class="phone">
      <div class="statusbar"><span>9:41</span><span>W.I.N.E. ⬢ <span class="batt"></span></span></div>
      <div class="screen" id="screen"></div>
      <div class="devwrap" id="devwrap"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="art.js"></script>
  <script src="career.js"></script>
  <script src="case-data.js"></script>
  <script src="passport-data.js"></script>
  <script>
  (function () {
    var screen = document.getElementById("screen");
    var devwrap = document.getElementById("devwrap");
    var S = Career.state();
    var doneIds = S.casesDone || [];
    var curCase = (window.CASES || []).filter(function (c) { return doneIds.indexOf(c.id) < 0; })[0] || (window.CASES || [])[0];
    var META = window.REGION_META || {};
    var ppTotal = Object.keys(META).length;
    var ppDisc = (S.regions || []).filter(function (k) { return META[k]; });
    var ppNewest = ppDisc.length ? (META[ppDisc[ppDisc.length - 1]].name) : null;
    var ppLocked = Object.keys(META).filter(function (k) { return ppDisc.indexOf(k) < 0; });
    var ppTeaser = ppLocked.length ? META[ppLocked[0]] : null;

    var grapeSeal =
      '<svg viewBox="0 0 40 40" fill="none"><circle cx="17" cy="15" r="2.4" fill="#D8BC73"/><circle cx="23" cy="13" r="2.4" fill="#D8BC73"/>' +
      '<circle cx="20" cy="19" r="2.4" fill="#D8BC73"/><circle cx="26" cy="17" r="2.4" fill="#D8BC73"/><circle cx="14" cy="19" r="2.4" fill="#D8BC73"/>' +
      '<circle cx="20" cy="25" r="2.4" fill="#D8BC73"/><circle cx="23" cy="23" r="2.4" fill="#D8BC73"/><circle cx="17" cy="23" r="2.4" fill="#D8BC73"/></svg>';

    var ICONS = {
      database: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>',
      case: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>',
      map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>',
      passport: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 17h6"/></svg>',
      evidence: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8l4 3-4 3M13 14h4"/></svg>',
      cellar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3h8l-1 7a4 4 0 0 1-3 3v6M9 10a4 4 0 0 0 3 3M8 21h8"/></svg>',
      campaign: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5l8 3 8-3v14l-8 3-8-3z"/><path d="M12 8v14"/></svg>',
      daily: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4M12 13v4M10 15h4"/></svg>',
      ranks: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="9" r="5"/><path d="M9 13l-2 8 5-3 5 3-2-8"/></svg>',
      ach: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M9 19h6M10 15v4M14 15v4"/></svg>'
    };

    /* LIVE modules link out; DEV modules open an info sheet. */
    var MODULES = [
      { ic: "database", name: "Criminal Database", sub: S.totalCriminals + " of The Decanted on file", href: "character-bible.html", live: true },
      { ic: "case", name: "Active Investigation", sub: curCase ? curCase.codename : "The clue-chase loop", href: "case-file.html" + (curCase ? "?case=" + curCase.id : ""), live: true },
      { ic: "map", name: "Operations Map", sub: "Track pursuits worldwide", href: "character-bible.html#map", live: true },
      { ic: "passport", name: "Agent Passport", sub: ppDisc.length + " of " + ppTotal + " regions stamped", href: "passport.html", live: true },
      { ic: "evidence", name: "Evidence Board", sub: "Pin clues & connect", dev: "A corkboard of photos, clues and red string. Pin evidence from across cases and connect The Decanted's network to expose the syndicate." },
      { ic: "cellar", name: "The Cellar", sub: "Recovered bottles", dev: "Your trophy cellar. Every legendary bottle you recover is racked here with its story, year, and the case that brought it home." },
      { ic: "campaign", name: "Case Files", sub: doneIds.length + " of " + (window.CASES ? window.CASES.length : 0) + " cases closed", board: true },
      { ic: "daily", name: "Daily Brief", sub: "New lead each day", dev: "A fresh procedurally-seeded lead every day — a quick case for steady XP, region progress, and daily streak rewards." },
      { ic: "ranks", name: "Career & Ranks", sub: S.rank + (S.nextRank ? " → " + S.nextRank : ""), dev: "The full W.I.N.E. promotion ladder, from Cadet to Master Detective — with the perks, clearance, and tools each rank unlocks." },
      { ic: "ach", name: "Achievements", sub: S.achievements.length + " of " + S.achievementDefs.length + " earned", dev: "Commendations and medals for clean arrests, full rosters, region sweeps and more — your wall of W.I.N.E. honors." }
    ];

    function render() {
      S = Career.state();
      ppDisc = (S.regions || []).filter(function (k) { return META[k]; });
      ppNewest = ppDisc.length ? (META[ppDisc[ppDisc.length - 1]].name) : null;
      ppLocked = Object.keys(META).filter(function (k) { return ppDisc.indexOf(k) < 0; });
      ppTeaser = ppLocked.length ? META[ppLocked[0]] : null;
      var caught = S.caughtIds.length;
      var html =
        '<div class="hq-head">' +
          '<div class="hq-top"><span class="seal">★</span> W.I.N.E. · Wine Intelligence &amp; Navigation Enforcement</div>' +
          '<div class="agent-row">' +
            '<div class="crest">' + grapeSeal + '<span class="badge-no">AGENT · 0451</span></div>' +
            '<div class="agent-meta"><div class="greet">Welcome back, Agent</div>' +
              '<div class="rank">' + S.rank + '</div></div>' +
          '</div>' +
          '<div class="xp-wrap"><div class="xp-bar"><i style="width:' + Math.round(S.progress * 100) + '%"></i></div>' +
            '<div class="xp-label"><span>' + S.xp + ' XP</span><span>' +
              (S.nextRank ? S.xpToNext + ' XP → ' + S.nextRank : 'Top rank achieved') + '</span></div></div>' +
        '</div>' +
        '<div class="stats-strip">' +
          statCell(S.casesSolved, "Cases") +
          statCell(caught + "/" + S.totalCriminals, "Caught") +
          statCell(S.regions.length, "Regions") +
          statCell(S.bottles.length, "Bottles") +
        '</div>' +
        '<div class="body">' +
          '<div class="sec-h">Current Assignment</div>' +
          '<a class="assignment" href="case-file.html">' +
            '<div class="a-pad"><div class="a-k"><span class="live"></span> Operation Comet · Priority</div>' +
              '<div class="a-title">The Vanishing Cuvée</div>' +
              '<div class="a-desc">The 1921 “Comet” Cuvée is gone — lifted mid-gala. Work the trail and bring our bottle home.</div>' +
              '<span class="a-go">Open the Case ›</span></div>' +
          '</a>' +
          '<a class="pp-sum-card" href="passport.html">' +
            '<div class="pps-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="9.5" r="3"/><path d="M8.5 17h7"/></svg></div>' +
            '<div class="pps-meta"><div class="pps-k">Agent Passport</div>' +
              '<div class="pps-v"><b>' + ppDisc.length + ' / ' + ppTotal + '</b> regions · ' +
                (ppNewest ? 'newest <b>' + ppNewest + '</b>' : 'no stamps yet') + '</div>' +
              (ppTeaser ? '<div class="pps-next">Next: ' + ppTeaser.name + ' · ' + ppTeaser.country + ' (locked)</div>' : '') +
            '</div><span class="pps-go">›</span>' +
          '</a>' +
          '<div class="sec-h">Departments</div>' +
          '<div class="modules" id="modules"></div>' +
          '<div class="sec-h" style="margin-top:24px">Commendations</div>' +
          '<div class="ach-row" id="ach"></div>' +
          '<div class="hq-footer">“We don\'t just drink history. We protect it.” — Cork Connoisseur</div>' +
          '<button class="reset-link" id="reset">Reset agent progress</button>' +
        '</div>';
      screen.innerHTML = html;

      var mods = document.getElementById("modules");
      MODULES.forEach(function (m) {
        var node;
        if (m.live) {
          node = document.createElement("a");
          node.href = m.href; node.style.textDecoration = "none";
          node.className = "module live";
        } else if (m.board) {
          node = document.createElement("button");
          node.className = "module live";
          node.onclick = function () { openBoard(); };
        } else {
          node = document.createElement("button");
          node.className = "module dev";
          node.onclick = function () { openDev(m); };
        }
        node.innerHTML =
          '<span class="m-status">' + ((m.live || m.board) ? "Open" : "Soon") + '</span>' +
          '<span class="m-ic">' + ICONS[m.ic] + '</span>' +
          '<span class="m-name">' + m.name + '</span>' +
          '<span class="m-sub">' + m.sub + '</span>';
        mods.appendChild(node);
      });

      var ach = document.getElementById("ach");
      S.achievementDefs.forEach(function (a) {
        var earned = S.achievements.indexOf(a.id) >= 0;
        var d = document.createElement("div");
        d.className = "ach" + (earned ? "" : " locked");
        d.innerHTML = '<div class="a-medal">' + (earned ? a.icon : "🔒") + '</div><div class="a-n">' + a.name + '</div>';
        ach.appendChild(d);
      });

      document.getElementById("reset").onclick = function () {
        Career.resetAll(); render();
      };
    }

    function statCell(num, lab) {
      return '<div class="stat-cell"><div class="num">' + num + '</div><div class="lab">' + lab + '</div></div>';
    }

    function openBoard() {
      var st = Career.state();
      var done = st.casesDone || [];
      var CS = window.CASES || [];
      var rows = CS.map(function (c, i) {
        var solved = done.indexOf(c.id) >= 0;
        var unlocked = i === 0 || done.indexOf(CS[i - 1].id) >= 0;
        var status = solved ? "✓ Closed" : (unlocked ? "Active" : "Locked");
        var cls = "cf-row " + (solved ? "solved" : (unlocked ? "open" : "locked"));
        var action = unlocked
          ? '<a class="cf-go" href="case-file.html?case=' + c.id + '">' + (solved ? "Replay" : "Open File") + ' ↦</a>'
          : '<span class="cf-lock">🔒 Solve “' + CS[i - 1].title + '” first</span>';
        return '<div class="' + cls + '">' +
            '<div class="cf-meta"><div class="cf-code">' + c.codename + ' · <span class="cf-stat">' + status + '</span></div>' +
            '<div class="cf-title">' + (unlocked ? c.title : "Classified") + '</div>' +
            '<div class="cf-reward">' + (unlocked ? c.reward : "————") + '</div></div>' +
            '<div class="cf-act">' + action + '</div>' +
          '</div>';
      }).join("");
      devwrap.innerHTML =
        '<div class="devcard"><div class="d-ic">' + ICONS.campaign + '</div>' +
        '<div class="d-tag">Campaign · ' + done.length + ' of ' + CS.length + ' closed</div>' +
        '<div class="d-name">Case Files</div>' +
        '<div class="cf-list">' + rows + '</div>' +
        '<button class="d-close" id="d-close">Close</button></div>';
      devwrap.classList.add("show");
      document.getElementById("d-close").onclick = function () { devwrap.classList.remove("show"); };
    }

    function openDev(m) {
      devwrap.innerHTML =
        '<div class="devcard"><div class="d-ic">' + ICONS[m.ic] + '</div>' +
        '<div class="d-tag">In Development</div><div class="d-name">' + m.name + '</div>' +
        '<div class="d-desc">' + m.dev + '</div>' +
        '<button class="d-close" id="d-close">Got it</button></div>';
      devwrap.classList.add("show");
      document.getElementById("d-close").onclick = function () { devwrap.classList.remove("show"); };
    }
    devwrap.addEventListener("click", function (e) { if (e.target === devwrap) devwrap.classList.remove("show"); });

    render();
  })();
  </script>
</body>
</html>
